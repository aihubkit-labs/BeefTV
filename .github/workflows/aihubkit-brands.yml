name: aihubkit brand acceptance

on:
  pull_request:
    paths:
      - 'scripts/aihubkit/brands*'
      - 'scripts/desktop_product.py'
      - 'scripts/package-desktop-installer.py'
      - 'scripts/build-beeftv*'
      - 'scripts/installers/**'
      - 'backend/internal/integrations/aihubkit/branding/**'
      - '.github/workflows/aihubkit-brands.yml'
      - '.github/workflows/desktop-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      brands: ${{ steps.snapshot.outputs.ids }}
      version: ${{ steps.snapshot.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check registry and freeze brand snapshots
        id: snapshot
        run: |
          python -m pip install Pillow==11.3.0
          python -m unittest discover -s scripts/aihubkit -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_prepare_github_desktop_release.py'
          python scripts/aihubkit/brands.py snapshot --output brand-snapshots > "$RUNNER_TEMP/brand-ids.json"
          echo "ids=$(cat "$RUNNER_TEMP/brand-ids.json")" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '[:space:]' < AIHUBKIT_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-brand-snapshots
          path: brand-snapshots
          if-no-files-found: error
      - name: Prepare shared source bundle
        run: |
          (cd web && bun install --frozen-lockfile)
          python scripts/package-wasm-sources.py --version "$(tr -d '[:space:]' < AIHUBKIT_VERSION)" --binary-dir web/node_modules/@ffmpeg/core/dist/esm
      - name: Verify branded and local UI behavior
        working-directory: web
        run: |
          bunx playwright install --with-deps webkit
          bun scripts/aihubkit-brand-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tag-wasm-source
          path: dist/BeefTV-*-ffmpeg-wasm-sources.tar.gz
          if-no-files-found: error
          compression-level: 0

  brands:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(needs.prepare.outputs.brands) }}
    uses: ./.github/workflows/desktop-installers.yml
    with:
      standalone-release: true
      release-tag: aihubkit-${{ needs.prepare.outputs.version }}
      release-version: ${{ needs.prepare.outputs.version }}
      brand-id: ${{ matrix.brand }}
